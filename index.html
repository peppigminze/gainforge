<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GAINFORGE</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#02040a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GAINFORGE">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Atmosphäre: Grid, Scanlines, Sweep, Ecken-Rahmen (reines CSS, GPU-schonend) -->
<div id="fx" aria-hidden="true"><div class="sweep"></div></div>
<div class="frame tl" aria-hidden="true"></div><div class="frame tr" aria-hidden="true"></div>
<div class="frame bl" aria-hidden="true"></div><div class="frame br" aria-hidden="true"></div>

<!-- Boot-Sequenz -->
<div id="boot">
  <div class="box">
    <div class="ttl">GAIN<span>FORGE</span></div>
    <div id="bootLines"></div>
    <div class="prog"><i id="bootProg"></i></div>
    <div id="bootFail" class="boot-fail" hidden>Konnte nicht starten. Internet prüfen und App neu öffnen.</div>
  </div>
</div>

<!-- LOGIN -->
<div id="authScreen" class="screen" hidden>
  <div class="screen-box glass">
    <div class="brand big"><span class="logo"></span><span class="t">GAIN<span>FORGE</span></span></div>
    <form id="authForm" class="stack" novalidate>
      <input type="email" id="authEmail" class="field" placeholder="E-Mail" required autocomplete="username" autocapitalize="none" spellcheck="false">
      <input type="password" id="authPassword" class="field" placeholder="Passwort" required autocomplete="current-password" minlength="6">
      <button type="submit" id="authSubmit" class="btn primary">Anmelden</button>
    </form>
    <button type="button" class="link" id="authModeToggle">Noch kein Konto? Konto erstellen</button>
    <p class="note">Die E-Mail ist nur dein Login-Name. Sie muss nicht existieren, es wird nichts verschickt. Passwort mindestens 6 Zeichen.</p>
    <p id="authError" class="msg err" hidden></p>
    <p id="authBusy" class="msg" hidden></p>
  </div>
</div>

<!-- ERSTES LOGIN: alte Daten übernehmen -->
<div id="migrateScreen" class="screen" hidden>
  <div class="screen-box glass">
    <div class="sec-title">Daten übernehmen</div>
    <p class="note" id="migrateIntro"></p>
    <div id="migrateList" class="stack"></div>
    <label class="btn ghost block">JSON-Backup importieren<input type="file" id="migrateFile" accept="application/json" hidden></label>
    <button type="button" class="link" id="migrateSkip">Leer starten</button>
    <p id="migrateError" class="msg err" hidden></p>
    <p id="migrateBusy" class="msg" hidden></p>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header id="top" class="glass">
    <div class="brand"><span class="logo"></span><span class="t">GAIN<span>FORGE</span></span></div>
    <button type="button" class="xp" id="xpBtn" aria-label="Level und XP">
      <span class="xp-lvl">LVL <b id="level">1</b></span>
      <span class="xp-bar"><i id="xpBarFill"></i></span>
    </button>
    <span class="sync" id="syncStatus" data-state="pending" title="Cloud-Status"><i></i></span>
    <button type="button" class="ib" id="termBtn" aria-label="Terminal öffnen">&gt;_</button>
    <button type="button" class="ib" id="settingsBtn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
  </header>

  <div id="hudLine" class="hud-line"></div>

  <main id="tiles" class="tiles">
    <!-- Fitness-Kacheln (js/fitness/ui.js) -->
    <button type="button" class="tile tile-hero" id="tileTraining" data-open="training"></button>
    <button type="button" class="tile" id="tileWeight" data-open="weight"></button>
    <button type="button" class="tile" id="tileProgress" data-open="progress"></button>
    <button type="button" class="tile" id="tileMuscle" data-open="muscles"></button>
    <button type="button" class="tile" id="tileVolume" data-open="progress"></button>
    <!-- Tagesplaner (js/calendar.js) -->
    <button type="button" class="tile tile-wide" id="tileToday" data-open="calendar"></button>
    <!-- Projekte (js/projects.js) -->
    <div class="tiles-label">Projekte</div>
    <div id="projectTiles" class="tiles-sub"></div>
  </main>

  <!-- Cypher: Sprach-/Chat-Blase. Inaktiv, bis sich Cypher über GAINFORGE.cypher.attach() verbindet (js/cypher.js) -->
  <button type="button" id="cypherSlot" data-state="offline" aria-label="Cypher (noch nicht verbunden)">
    <span class="cy-ring"></span><span class="cy-core"></span>
  </button>
</div>

<!-- Detail-Panel (Bottom-Sheet auf dem Handy, Seitenpanel am Desktop) -->
<div id="scrim" hidden></div>
<section id="sheet" class="glass" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <header class="phead">
    <button type="button" class="back" id="sheetBack" aria-label="Zurück" hidden>‹</button>
    <div class="phead-txt">
      <div class="pcat" id="sheetCat"></div>
      <h2 class="pname" id="sheetTitle"></h2>
      <div class="psub" id="sheetSub"></div>
    </div>
    <div class="phead-act" id="sheetActions"></div>
    <button type="button" class="close" id="sheetClose" aria-label="Schliessen">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div class="pbody" id="sheetBody"></div>
</section>

<!-- Terminal -->
<section id="term" aria-label="Terminal" hidden>
  <div class="thead"><span><i></i><i></i><i></i> GAINFORGE // TERMINAL</span><button type="button" id="termClose" aria-label="Terminal schliessen">✕</button></div>
  <div id="tOut"></div>
  <form class="tin" id="tForm" autocomplete="off"><span class="pr">&gt;</span><input id="tIn" type="text" autocapitalize="none" spellcheck="false" enterkeyhint="send" aria-label="Befehl"></form>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="app.js"></script>
<script>
  // Falls Firebase nicht laden kann (erster Start ohne Internet), nicht ewig im Boot-Screen hängen.
  setTimeout(function () {
    if (window.__gainforgeBooted) return;
    var el = document.getElementById("bootFail");
    if (el) el.hidden = false;
  }, 12000);
</script>
</body>
</html>
